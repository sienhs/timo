name: timo_gate
description: "TIMO 게이트 — 공연장 입구 검표 스캐너 앱"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  dio: ^5.11.1
  flutter_secure_storage: ^10.3.2
  flutter:
    sdk: flutter
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 팬 앱(`frontend/assets/images/`)과 같은 파일이다. 두 앱이 같은 브랜드를
  # 쓰므로 로고·마스코트는 같은 그림이어야 한다. 팬 앱에서 그림이 바뀌면
  # 여기도 함께 갈아 준다.
  assets:
    - assets/images/
