plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ssafy'
version = '0.0.1-SNAPSHOT'
description = 'timo'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'

    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // 캡차 상태(발급한 키·통과 기록)를 담는다. 만료가 곧 정책이라 TTL 이 없는 기본 캐시
    // (ConcurrentMapCacheManager)로는 안 되고, 캐시별 expireAfterWrite 를 주는 Caffeine 이 필요하다.
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    // JDBC 쿼리를 Micrometer Observation으로 감싸 Jaeger에 DB query span을 보낸다.
    implementation platform('net.ttddyy.observation:datasource-micrometer-bom:2.2.1')
    implementation 'net.ttddyy.observation:datasource-micrometer-spring-boot'
    implementation 'net.ttddyy.observation:datasource-micrometer-opentelemetry'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'com.solapi:sdk:1.0.3'
    implementation 'com.google.firebase:firebase-admin:9.10.0'

    // 커스터디얼 지갑 키페어 생성 및 V3 keystore 암복호화 / 서명에 사용한다.
    implementation 'org.web3j:core:4.14.0'

    // 공연 이미지를 S3 에 저장한다. 버킷·자격증명은 infra/modules/image-storage 가 만든다.
    implementation platform('software.amazon.awssdk:bom:2.51.1')
    implementation 'software.amazon.awssdk:s3'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testAndDevelopmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
