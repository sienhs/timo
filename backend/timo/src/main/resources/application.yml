spring:
  application:
    name: timo
  profiles:
    default: local #프로필 미지정 시 application-local.yml
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  Jackson:
    time-zone: Asia/Seoul
  # 공연 등록이 포스터 1장 + 상세 이미지 여러 장을 한 요청(multipart)에 같이 올린다. 기본값
  # (1MB/10MB)으로는 사진 한 장도 부족해서 올려 둔다. 파일 크기 제한은 환경과 무관한 값이라
  # 여기 한 곳에만 둔다.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

# 프론트 연동용 스텁 API(/api/v0/**) 스위치. 켜면 com.ssafy.timo.stub 의 컨트롤러가 함께 뜬다.
# 기본은 꺼 둔다. 실제 API(/api/v1/**) 는 이 값과 무관하게 언제나 뜬다.
# 프로필마다 값이 다르다: local 은 true, prod 는 false (application-{profile}.yml 참고).
api:
  stub:
    enabled: false

# 이미지 저장소(S3ImageStorage) 설정. bucket-name·base-url 은 비밀은 아니지만 프로파일마다 값이
# 갈리므로 여기 기본값을 두지 않는다(application-{profile}.yml 참고, local/test 는 S3ImageStorage
# 자체가 뜨지 않아 필요 없다). region 은 리전이 갈릴 일이 없어 여기 공통 기본값 하나만 둔다.
app:
  image:
    region: ${AWS_REGION:ap-northeast-2}

# 비밀키(jwt.secret)는 프로파일마다 달라 application-{profile}.yml 에 있다.
# 수명은 환경과 무관하게 같아야 앱 동작이 갈리지 않으므로 여기 한 곳에만 둔다.
jwt:
  access-token-ttl: 30m

# 입장 QR 서명키(entry-pass.secret)도 프로파일마다 다르다. 수명은 환경과 무관하게 같아야
# 팬 앱의 재발급 주기와 게이트 판정이 환경별로 갈리지 않으므로 여기 한 곳에만 둔다.
entry-pass:
  ttl: 30s

# 양도 마켓 운영 시간(매일, 양 끝 포함). 남의 매물 조회와 구매는 이 창 안에서만, 가격 수정은 창 밖에서만
# 받고 판정은 서버 시계로 한다. 등록은 시간 무관 - 닫힌 시간에 올린 매물이 20:00 에 한꺼번에 드러난다.
# 환경마다 다르면 "로컬은 되는데 배포하면 409" 가 나므로 여기 한 곳에만 둔다.
market:
  hours:
    open-at: "20:00:00"
    close-at: "23:59:59"

# SSAFY EC2에 올린 persistent Hardhat 노드. 컨트랙트 주소는 여기 없다 - admin-private-key로부터
# 결정적으로 계산된다(DeployedContractAddresses 참고). admin-private-key 기본값은 빈 문자열 -
# 로컬/테스트에서 없어도 그냥 비어 있는 채로 뜬다(Web3jConfig가 그동안 쓸 더미 키를 알아서
# 생성함). prod는 이 기본값을 못 쓰게 application-prod.yml이 자체적으로 덮어써서 값이 없으면
# 기동 자체가 실패하게 한다.
blockchain:
  rpc-url: http://network.ticketmoa.site:8545
  admin-private-key: ${ADMIN_PRIVATE_KEY:}

management:
  endpoints:
    web:
      exposure:
        # health is public for the ALB. prometheus remains protected by the
        # security filter chain and is intended for the monitoring collector.
        include: health, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
