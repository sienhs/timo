spring:
  application:
    name: timo
  profiles:
    default: local #프로필 미지정 시 application-local.yml
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  Jackson:
    time-zone: Asia/Seoul

# 프론트 연동용 스텁 API(/api/v0/**) 스위치. 켜면 com.ssafy.timo.stub 의 컨트롤러가 함께 뜬다.
# 기본은 꺼 둔다. 실제 API(/api/v1/**) 는 이 값과 무관하게 언제나 뜬다.
# 프로필마다 값이 다르다: local 은 true, prod 는 false (application-{profile}.yml 참고).
api:
  stub:
    enabled: false

# 비밀키(jwt.secret)는 프로파일마다 달라 application-{profile}.yml 에 있다.
# 수명은 환경과 무관하게 같아야 앱 동작이 갈리지 않으므로 여기 한 곳에만 둔다.
jwt:
  access-token-ttl: 30m

# SSAFY EC2에 올린 persistent Hardhat 노드. 컨트랙트 주소는 비밀이 아니라 여기(공통)에 둔다.
# admin-private-key만 프로필별(application-{profile}.yml)로 다르게 준다.
blockchain:
  rpc-url: http://network.ticketmoa.site:8545
  ticket-vault-address: "0xdD118811921b1B04E23aBFEe9f86572dD2C92774"
  ticket-nft-address: "0x24f51CdB47EC392b88700C474c72A7b258d050Fc"
  show-registry-address: "0x2D9a37f3E2e963882740cd385bd31f24694dA6eF"

management:
  endpoints:
    web:
      exposure:
        # health is public for the ALB. prometheus remains protected by the
        # security filter chain and is intended for the monitoring collector.
        include: health, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
