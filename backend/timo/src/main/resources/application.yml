spring:
  application:
    name: timo
  profiles:
    default: local #프로필 미지정 시 application-local.yml
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  Jackson:
    time-zone: Asia/Seoul
  # 공연 등록이 포스터 1장 + 상세 이미지 여러 장을 한 요청(multipart)에 같이 올린다. 기본값
  # (1MB/10MB)으로는 사진 한 장도 부족해서 올려 둔다. 파일 크기 제한은 환경과 무관한 값이라
  # 여기 한 곳에만 둔다.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

# 프론트 연동용 스텁 API(/api/v0/**) 스위치. 켜면 com.ssafy.timo.stub 의 컨트롤러가 함께 뜬다.
# 기본은 꺼 둔다. 실제 API(/api/v1/**) 는 이 값과 무관하게 언제나 뜬다.
# 프로필마다 값이 다르다: local 은 true, prod 는 false (application-{profile}.yml 참고).
api:
  stub:
    enabled: false

# 이미지 저장소(S3ImageStorage) 설정. bucket-name·base-url 은 비밀은 아니지만 프로파일마다 값이
# 갈리므로 여기 기본값을 두지 않는다(application-{profile}.yml 참고, local/test 는 S3ImageStorage
# 자체가 뜨지 않아 필요 없다). region 은 리전이 갈릴 일이 없어 여기 공통 기본값 하나만 둔다.
app:
  image:
    region: ${AWS_REGION:ap-northeast-2}
  firebase:
    # 기본은 꺼 둔다. 서비스 계정이 없는 로컬·테스트 기동을 막지 않는다.
    messaging-enabled: ${FIREBASE_MESSAGING_ENABLED:false}

  # 굿즈 이미지 업로드 대장과 청소 배치. 값은 코드의 기본값과 같다.
  goods:
    # 이 일수가 지난 업로드분 중 굿즈가 없는 티켓의 것을 주 1회 지운다. 업로드와 생성 호출 사이의
    # 간격을 재는 값이라, 앱이 한 세션 안에서 둘을 끝내는 지금은 분 단위면 충분한데 넉넉히 잡았다.
    upload-retention-days: 7
    # false 이면 아무것도 지우지 않는다.
    cleanup-enabled: true

  # 알림 스윕과 보존. 값은 코드의 기본값과 같다. 여기 적어 두는 것은 바꿀 자리를 한눈에 보이게 하려는 것이다.
  notification:
    # 스윕 하나가 한 주기(1분)에 새로 저장할 수 있는 알림의 최대 개수. 넘는 대상은 다음 주기에 이어서 나간다.
    sweep-limit: 500
    # 놓친 발송을 다시 찾아 주는 구간. 서버가 내려가 있거나 주기가 밀려도 이 안에서는 나간다. 이미 나간 것은
    # 중복 방지가 막으므로 넉넉해도 안전하지만, 길면 철 지난 알림이 늦게 나간다.
    catch-up: PT1H
    # 이 일수가 지난 알림은 하루 한 번 지운다. catch-up 에 하루를 더한 것보다 길어야 한다(아니면 기동 실패).
    # 법무나 개인정보 처리방침이 더 긴 보관을 요구하면 여기만 바꾼다.
    retention-days: 90
    # false 이면 아무것도 지우지 않는다.
    retention-enabled: true

  # 푸시 발송. 채널은 앱이 만든 안드로이드 알림 채널 이름이다. 비어 있으면 채널을 싣지 않아 앱의 기본 채널로
  # 떨어진다. 앱이 만들지 않은 이름을 넣으면 안드로이드 8.0 이상에서는 알림이 아예 표시되지 않고 로그도 없다.
  push:
    channel:
      entry: ${PUSH_CHANNEL_ENTRY:}
      general: ${PUSH_CHANNEL_GENERAL:}
    # 일시적으로 실패한 발송을 다시 시도하는 횟수. 처음 시도는 세지 않는다.
    retry: 2

# 비밀키(jwt.secret)는 프로파일마다 달라 application-{profile}.yml 에 있다.
# 수명은 환경과 무관하게 같아야 앱 동작이 갈리지 않으므로 여기 한 곳에만 둔다.
jwt:
  access-token-ttl: 30m

# @Scheduled 잡 전체 스위치. 공연 상태를 날짜에 맞춰 미는 잡(ConcertStatusScheduler)이 여기 달려
# 있다. 통합 테스트 프로파일만 이 값을 끈다 - 잡이 별도 스레드에서 커밋하면 테스트 롤백을 통과해
# 다음 테스트로 새어 나간다. 배포 환경에서 끌 일은 없지만, 잡이 의심될 때 재배포 없이 떼어 볼 수
# 있도록 속성으로 둔다.
scheduling:
  enabled: true

# 입장 QR 서명키(entry-pass.secret)도 프로파일마다 다르다. 수명은 환경과 무관하게 같아야
# 팬 앱의 재발급 주기와 게이트 판정이 환경별로 갈리지 않으므로 여기 한 곳에만 둔다.
entry-pass:
  ttl: 30s

# 양도 마켓 운영 시간(매일, 양 끝 포함). 남의 매물 조회와 구매는 이 창 안에서만, 가격 수정은 창 밖에서만
# 받고 판정은 서버 시계로 한다. 등록은 시간 무관 - 닫힌 시간에 올린 매물이 08:00 에 한꺼번에 드러난다.
# 환경마다 다르면 "로컬은 되는데 배포하면 409" 가 나므로 여기 한 곳에만 둔다.
market:
  hours:
    open-at: "08:00:00"
    close-at: "23:00:00"

# SSAFY EC2에 올린 persistent Hardhat 노드. 컨트랙트 주소는 여기 없다 - admin-private-key로부터
# 결정적으로 계산된다(DeployedContractAddresses 참고). admin-private-key 기본값은 빈 문자열 -
# 로컬/테스트에서 없어도 그냥 비어 있는 채로 뜬다(Web3jConfig가 그동안 쓸 더미 키를 알아서
# 생성함). prod는 이 기본값을 못 쓰게 application-prod.yml이 자체적으로 덮어써서 값이 없으면
# 기동 자체가 실패하게 한다.
blockchain:
  rpc-url: http://network.ticketmoa.site:8545
  admin-private-key: ${ADMIN_PRIVATE_KEY:}

management:
  endpoints:
    web:
      exposure:
        # health is public for the ALB. prometheus remains protected by the
        # security filter chain and is inztended for the monitoring collector.
        include: health, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
