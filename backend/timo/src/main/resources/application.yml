spring:
  application:
    name: timo
  profiles:
    default: local #프로필 미지정 시 application-local.yml
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  Jackson:
    time-zone: Asia/Seoul

# 비밀키(jwt.secret)는 프로파일마다 달라 application-{profile}.yml 에 있다.
# 수명은 환경과 무관하게 같아야 앱 동작이 갈리지 않으므로 여기 한 곳에만 둔다.
jwt:
  access-token-ttl: 30m

management:
  endpoints:
    web:
      exposure:
        include: health, env, configprops
  endpoint:
    health:
      show-details: always