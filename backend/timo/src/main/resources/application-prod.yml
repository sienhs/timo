spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  # Redis 기능을 도입할 때 다시 활성화한다.
  # data:
  #   redis:
  #     host: ${REDIS_HOST}
  #     port: ${REDIS_PORT:6379}
  #     password: ${REDIS_PASSWORD:}
  #     database: 0

logging:
  level:
    root: info

jwt:
  secret: ${JWT_SECRET}

# 배포 환경은 실제 API(/api/v1/**) 만 연다. 기본값도 false 지만, 운영에 스텁이 올라가면
# 인증 없이 가짜 토큰을 내주는 셈이라 의도를 명시해 둔다.
api:
  stub:
    enabled: false

wallet:
  master-key: ${WALLET_MASTER_KEY}

solapi:
  api-key: ${SOLAPI_API_KEY}
  api-secret: ${SOLAPI_API_SECRET}
  sender-phone-number: ${SOLAPI_SENDER_PHONE}
