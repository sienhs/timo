spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # RDS 스키마는 Terraform의 SSM bootstrap SQL이 만든다. 운영 기동 시 Hibernate가
      # 제약·인덱스 등을 임의로 추가하지 않고 엔티티와의 불일치만 검증하게 한다.
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      ssl:
        enabled: true

waiting-queue:
  active-limit: ${WAITING_QUEUE_ACTIVE_LIMIT:100}
  admission-ttl: ${WAITING_QUEUE_ADMISSION_TTL:PT5M}

logging:
  level:
    root: info

management:
  # Prometheus가 /actuator/prometheus를 pull한다. 별도 OTLP metrics push는 이 컨테이너의
  # localhost:4318에 수신기가 없어 주기적인 연결 실패를 유발하므로 운영에서 끈다.
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${TRACING_OTLP_ENDPOINT}

# datasource-micrometer가 DataSource를 프록시해 SQL 실행만 span으로 기록한다.
# 바인드 파라미터와 SQL 로그는 개인정보·토큰 유출 및 불필요한 부하를 막기 위해 기록하지 않는다.
jdbc:
  includes: QUERY
  datasource-proxy:
    include-parameter-values: false
    query:
      enable-logging: false
  opentelemetry:
    spans:
      enabled: true
    metrics:
      enabled: false

jwt:
  secret: ${JWT_SECRET}

entry-pass:
  secret: ${ENTRY_PASS_SECRET}

# 배포 환경은 실제 API(/api/v1/**) 만 연다. 기본값도 false 지만, 운영에 스텁이 올라가면
# 인증 없이 가짜 토큰을 내주는 셈이라 의도를 명시해 둔다.
api:
  stub:
    enabled: false

# infra/modules/image-storage 의 runtime_environment 출력이 이 두 값과 AWS_ACCESS_KEY_ID/
# AWS_SECRET_ACCESS_KEY/AWS_REGION 을 함께 내려준다. 자격증명은 SDK 기본 체인이 환경변수에서
# 바로 읽으므로 여기 따로 옮겨 적지 않는다.
app:
  image:
    bucket-name: ${S3_PUBLIC_BUCKET_NAME}
    base-url: ${IMAGE_BASE_URL}

wallet:
  master-key: ${WALLET_MASTER_KEY}

blockchain:
  admin-private-key: ${ADMIN_PRIVATE_KEY}

solapi:
  api-key: ${SOLAPI_API_KEY}
  api-secret: ${SOLAPI_API_SECRET}
  sender-phone-number: ${SOLAPI_SENDER_PHONE}
