spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    # 시드 SQL 을 Hibernate 가 스키마를 만든 뒤에 실행한다. 이게 없으면 테이블이
    # 생기기 전에 스크립트가 돌아 실패한다.
    defer-datasource-initialization: true
  sql:
    init:
      # 기본값 embedded 는 H2 같은 내장 DB 에만 스크립트를 돌린다. MySQL 은 대상이 아니라 always 가 필요하다.
      mode: always
      # data.sql 대신 경로를 명시해, 프로필을 안 타는 위치에 시드가 놓여 실수로 운영에서 돌 일이 없게 한다.
      data-locations: classpath:db/seed-local.sql
      # 명시하지 않으면 플랫폼 기본 charset(윈도우는 MS949)으로 읽어 한글이 깨진다.
      encoding: UTF-8
  docker:
    compose:
      lifecycle-management: start-only    # 앱 껐다 켤 때마다 DB가 내려가지 않게

logging:
  level:
    # 기본은 debug 로 두어 로컬에서 쿼리가 보이게 한다. 시끄러우면 환경변수로만 낮춘다
    # (예: HIBERNATE_SQL_LOG_LEVEL=error) - 파일을 고치면 커밋에 섞인다.
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:debug}

jwt:
  secret: local-dev-only-secret-please-change-in-prod-0123456789

entry-pass:
  secret: local-dev-only-entry-pass-secret-please-change-in-prod-0123456789

# 로컬은 프론트가 붙어 보는 환경이라 스텁(/api/v0/**) 을 켠다. 실제 API(/api/v1/**) 도 같이 뜬다.
api:
  stub:
    enabled: true

# 로컬은 PlaceholderImageStorage 가 떠서 S3 를 타지 않고 key 앞에 이 값만 붙여 URL 을 만든다.
# 비워 두면 key 가 그대로 URL 이 되어, static 아래 파일이 있는 동안에는 정적 리소스로 서빙된다.
# 그 파일을 지운 뒤에도 로컬에서 이미지를 보려면 infra/modules/image-storage 의
# image_base_url(CloudFront 주소)을 IMAGE_BASE_URL 로 내보낸다 - 그러면 demo 가 올려 둔 객체를 본다.
app:
  image:
    base-url: ${IMAGE_BASE_URL:}

wallet:
  master-key: ec94c90e35eb865661cf6841f750256ba8bb1d78898db219ef9928438a23eb99

# 실제 체인에 트랜잭션을 보내려면 blockchain/.env 의 ADMIN_PRIVATE_KEY 를 환경변수로 내보내야 한다
# (기본값은 application.yml 공통 설정 참고). 안 내보내면 앱은 정상 기동하고 실제 전송을 시도하는
# 기능만 막힌다 (EC2 방화벽이 지정 IP만 허용하므로 이 키가 있어도 방화벽 허용 없인 어차피 막힌다).
