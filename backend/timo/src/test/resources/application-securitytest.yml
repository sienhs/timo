# 시큐리티 필터 체인을 실제로 태우는 테스트 전용 프로파일.
#
# SecurityConfig 가 @Profile("!local & !test") 라 test 프로파일에서는 뜨지 않는다.
# 잠금을 검증하려면 그 조건을 만족하는 별도 프로파일이 필요하다.
#
# ddl-auto 를 update 로 둔 이유: test 프로파일 컨텍스트와 같은 스키마를 쓰므로
# create-drop 이면 서로의 테이블을 지운다.
spring:
  datasource:
    url: jdbc:mysql://localhost:13306/${TEST_DB:timo_test}?connectionTimeZone=Asia/Seoul
    username: timo
    password: timo1234
  jpa:
    hibernate:
      ddl-auto: update

jwt:
  secret: local-dev-only-secret-please-change-in-prod-0123456789

wallet:
  master-key: ec94c90e35eb865661cf6841f750256ba8bb1d78898db219ef9928438a23eb99

# 이 프로파일에서는 SolapiSmsSender 가 뜬다. 실제 발송은 하지 않지만 값이 없으면 기동에 실패한다.
solapi:
  api-key: test-api-key
  api-secret: test-api-secret
  sender-phone-number: "01000000000"
