services:
  mysql:
    # Spring Boot Docker Compose 지원이 image 이름으로 MySQL 서비스임을 인식해
    # datasource 를 자동 구성하므로, 커스텀 빌드를 하더라도 태그는 mysql:8.0 유지
    build: ./docker/mysql
    image: mysql:8.0
    container_name: timo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: timo
      MYSQL_USER: timo
      MYSQL_PASSWORD: timo1234
      TZ: Asia/Seoul
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 컨테이너 최초 생성 시에만 실행됨 (데이터 볼륨이 비어 있을 때)
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
  # 단일 인스턴스에서는 SMS 인증 상태를 애플리케이션 메모리에 저장한다.
  # redis:
  #   image: redis:7-alpine
  #   container_name: timo-redis
  #   ports:
  #     - "6379:6379"
  #   command: [ "redis-server", "--appendonly", "no" ]

volumes:
  mysql-data:
