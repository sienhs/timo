.backend_changes:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      changes:
        - backend/**/*
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes:
        - backend/**/*
        - .gitlab-ci.yml
    - when: never

.backend_develop:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes:
        - backend/**/*
        - .gitlab-ci.yml
    - when: never

.backend_aws:
  image: python:3.12-slim
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: sts.amazonaws.com
  variables:
    AWS_DEFAULT_REGION: ap-northeast-2
    AWS_EC2_METADATA_DISABLED: "true"
    AWS_PAGER: ""
  before_script:
    - pip install --disable-pip-version-check 'awscli>=1.32,<2'
    # 기존 단일 행은 YAML 매핑으로 해석될 수 있어 블록으로 전환한다.
    - |
      : "${BACKEND_AWS_ROLE_ARN:?Set this protected GitLab CI/CD variable}"
    - printf '%s' "$AWS_OIDC_TOKEN" > "$CI_PROJECT_DIR/.aws-oidc-token"
    - export AWS_ROLE_ARN="$BACKEND_AWS_ROLE_ARN"
    - export AWS_WEB_IDENTITY_TOKEN_FILE="$CI_PROJECT_DIR/.aws-oidc-token"
    - aws sts get-caller-identity
  after_script:
    - rm -f "$CI_PROJECT_DIR/.aws-oidc-token"

backend_test:
  extends: .backend_changes
  stage: test
  image: eclipse-temurin:21-jdk-jammy
  services:
    - name: mysql:8.0
      alias: mysql
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/backend/timo/.gradle"
    MYSQL_DATABASE: timo_test
    MYSQL_USER: timo
    MYSQL_PASSWORD: ci-test-password
    MYSQL_ROOT_PASSWORD: ci-test-root-password
    SPRING_PROFILES_ACTIVE: test
    SPRING_DOCKER_COMPOSE_ENABLED: "false"
    SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/timo_test?allowPublicKeyRetrieval=true&useSSL=false&connectionTimeZone=Asia/Seoul"
    SPRING_DATASOURCE_USERNAME: timo
    SPRING_DATASOURCE_PASSWORD: ci-test-password
    SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT: "60000"
  cache:
    key:
      files:
        - backend/timo/gradle/wrapper/gradle-wrapper.properties
        - backend/timo/build.gradle
    paths:
      - backend/timo/.gradle/wrapper/
      - backend/timo/.gradle/caches/
  script:
    - cd backend/timo
    - >
      bash gradlew test
      --tests '*ServiceImplTest'
      --tests 'com.ssafy.timo.domain.auth.repository.SmsVerificationStoreTest'
      --tests 'com.ssafy.timo.TimoApplicationTests'
      bootJar
      --no-daemon
  artifacts:
    when: always
    reports:
      junit: backend/timo/build/test-results/test/TEST-*.xml
    paths:
      - backend/timo/build/reports/tests/test/
    expire_in: 7 days

backend_build:
  extends:
    - .backend_aws
    - .backend_develop
  stage: build
  needs:
    - job: backend_test
      artifacts: false
  timeout: 40 minutes
  script:
    # 기존 단일 행은 YAML 매핑으로 해석될 수 있어 블록으로 전환한다.
    - |
      : "${BACKEND_SOURCE_BUCKET:?Set this protected GitLab CI/CD variable}"
    # 기존 단일 행은 YAML 매핑으로 해석될 수 있어 블록으로 전환한다.
    - |
      : "${BACKEND_CODEBUILD_PROJECT:?Set this protected GitLab CI/CD variable}"
    - export BACKEND_SOURCE_KEY="sources/${CI_PIPELINE_ID}/${CI_COMMIT_SHA}.zip"
    - |
      python - <<'PY'
      from pathlib import Path
      from zipfile import ZIP_DEFLATED, ZipFile

      root = Path('.').resolve()
      target = (root / 'backend-source.zip').resolve()
      backend = root / 'backend/timo'
      # Only Docker build inputs; never package CI credentials or local env files.
      inputs = [backend / name for name in (
          'Dockerfile', 'gradlew', 'build.gradle', 'settings.gradle')]
      inputs.extend(path for directory in ('gradle', 'src')
                    for path in (backend / directory).rglob('*') if path.is_file())
      with ZipFile(target, 'w', ZIP_DEFLATED) as archive:
          # for path in root.rglob('*'):
          #     if path.is_file() and '.git' not in path.parts and path != target:
          #         archive.write(path, path.relative_to(root))
          for path in inputs:
              if path.is_symlink() or not path.resolve().is_relative_to(backend):
                  raise ValueError('Build input must stay within backend/timo')
              if path.name == '.env' or path.name.startswith('.env.'):
                  continue
              archive.write(path, path.relative_to(root))
      PY
    - aws s3 cp backend-source.zip "s3://${BACKEND_SOURCE_BUCKET}/${BACKEND_SOURCE_KEY}"
    - export IMAGE_TAG="${CI_COMMIT_SHA}-${CI_JOB_ID}"
    - >
      BUILD_ID="$(aws codebuild start-build
      --project-name "$BACKEND_CODEBUILD_PROJECT"
      --source-type-override S3
      --source-location-override "${BACKEND_SOURCE_BUCKET}/${BACKEND_SOURCE_KEY}"
      --environment-variables-override "name=IMAGE_TAG,value=${IMAGE_TAG},type=PLAINTEXT"
      --query 'build.id' --output text)"
    - |
      echo "CodeBuild started: ${BUILD_ID}"
    - |
      for attempt in $(seq 1 210); do
        status=$(aws codebuild batch-get-builds --ids "$BUILD_ID" --query 'builds[0].buildStatus' --output text)
        case "$status" in
          SUCCEEDED) break ;;
          FAILED|FAULT|STOPPED|TIMED_OUT) echo "CodeBuild failed: $status"; exit 1 ;;
          IN_PROGRESS) sleep 10 ;;
          *) echo "Unexpected CodeBuild status: $status"; exit 1 ;;
        esac
        if [ "$attempt" = 210 ]; then
          aws codebuild stop-build --id "$BUILD_ID" > /dev/null
          echo "CodeBuild wait timed out"; exit 1
        fi
      done
    - printf 'BACKEND_IMAGE_TAG=%s\n' "$IMAGE_TAG" > image.env
  artifacts:
    reports:
      dotenv: image.env
    expire_in: 1 day

backend_deploy:
  extends:
    - .backend_aws
    - .backend_develop
  stage: deploy
  needs:
    - job: backend_build
      artifacts: true
  resource_group: backend-development
  environment:
    name: backend/development
  interruptible: false
  timeout: 15 minutes
  script:
    # 기존 단일 행은 YAML 매핑으로 해석될 수 있어 블록으로 전환한다.
    - |
      : "${BACKEND_EC2_INSTANCE_ID:?Set this protected GitLab CI/CD variable}"
    # 기존 단일 행은 YAML 매핑으로 해석될 수 있어 블록으로 전환한다.
    - |
      : "${BACKEND_ECR_REPOSITORY_URL:?Set this protected GitLab CI/CD variable}"
    - export BACKEND_IMAGE_URI="${BACKEND_ECR_REPOSITORY_URL}:${BACKEND_IMAGE_TAG}"
    - printf '%s' "$BACKEND_EC2_INSTANCE_ID" | grep -Eq '^i-[0-9a-f]+$'
    - printf '%s' "$BACKEND_IMAGE_URI" | grep -Eq '^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9._/-]+:[a-f0-9]+-[0-9]+$'
    - |
      python - <<'PY'
      import json
      import os
      import shlex

      command = shlex.join([
          'bash', '/opt/timo/deploy.sh',
          os.environ['BACKEND_IMAGE_URI'], os.environ['CI_PIPELINE_IID'],
      ])
      with open('ssm-parameters.json', 'w', encoding='utf-8') as output:
          json.dump({'commands': [command]}, output)
      PY
    - |
      # JSON avoids AWS CLI shorthand parsing of shell quotes.
      if ! COMMAND_ID="$(aws ssm send-command \
        --instance-ids "$BACKEND_EC2_INSTANCE_ID" \
        --document-name AWS-RunShellScript \
        --parameters file://ssm-parameters.json \
        --timeout-seconds 60 \
        --query 'Command.CommandId' --output text)"; then
        echo "Failed to send EC2 deployment command" >&2
        exit 1
      fi
      if [ -z "$COMMAND_ID" ] || [ "$COMMAND_ID" = "None" ]; then
        echo "SSM returned no command ID" >&2
        exit 1
      fi
    - |
      echo "SSM deployment started: ${COMMAND_ID}"
    - |
      for attempt in $(seq 1 144); do
        if ! status=$(aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" --instance-id "$BACKEND_EC2_INSTANCE_ID" \
          --query Status --output text 2>ssm-status-error.log); then
          # SSM may not expose the invocation immediately after SendCommand.
          if [ "$attempt" -le 6 ] && grep -q 'InvocationDoesNotExist' ssm-status-error.log; then
            sleep 5
            continue
          fi
          cat ssm-status-error.log >&2
          exit 1
        fi
        case "$status" in
          Success) exit 0 ;;
          Pending|InProgress|Delayed) sleep 5 ;;
          *)
            echo "EC2 deployment failed: $status" >&2
            # Surface the remote deployment script's diagnostics without
            # exposing CI credentials.  This is the authoritative error when
            # image pull, Secrets Manager, container startup, or health checks
            # fail on the target host.
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$BACKEND_EC2_INSTANCE_ID" \
              --query '{output:StandardOutputContent,error:StandardErrorContent}' \
              --output json >&2 || true
            exit 1
            ;;
        esac
      done
      echo "Deployment completion was not confirmed"; exit 1
