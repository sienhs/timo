name: timo
description: "TIMO 티켓 예매 앱"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_secure_storage: ^10.3.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.0
  flutter_local_notifications: ^19.5.0

  # 메모리 티켓(소장품). 사진을 골라 온디바이스로 처리하고, 만든 소장품을
  # 기기에 두고, 기울이기·영상 재생으로 본다.
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  sensors_plus: ^7.1.0
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 메모리 티켓의 온디바이스 처리는 실기기에서만 검증된다(integration_test/).
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/demo/
    - assets/videos/

  # 메모리 티켓 효과. 런타임에 ShaderCache 가 이름으로 찾는다.
  #
  # assets/models/ 는 여기 없다 — 추론 모델은 네이티브가 AssetManager 로 직접
  # 열고(android/app/build.gradle.kts 의 sync 태스크) Flutter 에셋으로도 올리면
  # 같은 수십 MB 가 APK 에 두 번 들어간다.
  shaders:
    - shaders/aurora.frag
    - shaders/depth_parallax.frag
    - shaders/person_depth.frag
    - shaders/person_layers.frag
    - shaders/holo_foil.frag
    - shaders/smog.frag
    - shaders/particles.frag
    - shaders/volumetric.frag
    - shaders/god_rays.frag
    - shaders/rim_light.frag
