frontend_analyze:
  stage: test
  image: ghcr.io/cirruslabs/flutter:stable

  before_script:
    - cd frontend
    - flutter --version
    - flutter pub get

  script:
    - flutter analyze

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/**/*
    - when: never


frontend_test:
  stage: test
  image: ghcr.io/cirruslabs/flutter:stable

  before_script:
    - cd frontend
    - flutter pub get

  script:
    - flutter test

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/**/*
    - when: never


frontend_build:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  # A cold container has to install Android SDK/NDK/CMake before assembling
  # the release APK; the project-wide 10-minute default terminates Gradle.
  timeout: 30 minutes

  before_script:
    # The runner checkout can leave LFS objects as pointer files because this
    # image does not ship with git-lfs.  Fetch them explicitly before Gradle
    # copies the on-device models into the release APK.
    - apt-get update && apt-get install -y --no-install-recommends git-lfs
    - git lfs install --local
    - git lfs pull --include="frontend/assets/models/*.onnx,frontend/android/app/src/main/assets/models/*.task"
    - |
      for model in \
        frontend/assets/models/depth_anything_v2_vits_int8.onnx \
        frontend/assets/models/modnet_photographic_portrait_matting.onnx \
        frontend/android/app/src/main/assets/models/pose_landmarker_lite.task
      do
        ! head -n 1 "$model" | grep -qx 'version https://git-lfs.github.com/spec/v1'
      done
    - cd frontend
    - flutter pub get

  script:
    - flutter build apk --release --build-number="$CI_PIPELINE_IID"

  artifacts:
    paths:
      - frontend/build/app/outputs/flutter-apk/app-release.apk
    expire_in: 7 days

  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes:
        - frontend/**/*
    - when: never


frontend_deploy:
  stage: deploy
  image: node:22-bookworm-slim

  needs:
    - job: frontend_build
      artifacts: true

  before_script:
    - npm install -g firebase-tools
    - |
      : "${FIREBASE_SERVICE_ACCOUNT:?Set the Firebase service-account CI/CD variable}"
      # GitLab file variables already contain a path.  For an ordinary masked
      # variable, materialize the JSON without ever printing it in the log.
      if [ -f "$FIREBASE_SERVICE_ACCOUNT" ]; then
        export GOOGLE_APPLICATION_CREDENTIALS="$FIREBASE_SERVICE_ACCOUNT"
      else
        umask 077
        printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CI_PROJECT_DIR/firebase-service-account.json"
        export GOOGLE_APPLICATION_CREDENTIALS="$CI_PROJECT_DIR/firebase-service-account.json"
      fi

  script:
    - >
      firebase appdistribution:distribute
      frontend/build/app/outputs/flutter-apk/app-release.apk
      --app "$FIREBASE_APP_ID"
      --groups "$FIREBASE_TESTER_GROUP"
      --release-notes "${CI_COMMIT_SHORT_SHA} - ${CI_COMMIT_TITLE}"

  after_script:
    - rm -f "$CI_PROJECT_DIR/firebase-service-account.json"

  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes:
        - frontend/**/*
    - when: never
