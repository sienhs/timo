frontend_analyze:
  stage: test
  image: ghcr.io/cirruslabs/flutter:stable

  before_script:
    - cd frontend
    - flutter --version
    - flutter pub get

  script:
    - flutter analyze

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/**/*
    - when: never


frontend_test:
  stage: test
  image: ghcr.io/cirruslabs/flutter:stable

  before_script:
    - cd frontend
    - flutter pub get

  script:
    - flutter test

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/**/*
    - when: never


frontend_build:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  # A cold container has to install Android SDK/NDK/CMake before assembling
  # the release APK; the project-wide 10-minute default terminates Gradle.
  timeout: 30 minutes
  variables:
    # Keep the script limit below the job limit and reserve time for artifact
    # upload/cleanup after the release build.
    RUNNER_SCRIPT_TIMEOUT: "25m"
    RUNNER_AFTER_SCRIPT_TIMEOUT: "4m"

  before_script:
    # The runner checkout can leave LFS objects as pointer files because this
    # image does not ship with git-lfs.  Fetch them explicitly before Gradle
    # copies the on-device models into the release APK.
    # Firebase distribution runs here as well: the universal APK exceeds this
    # GitLab instance's artifact-size limit, so it cannot be handed to another
    # job as an artifact.
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git-lfs
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y --no-install-recommends nodejs
    - npm install -g firebase-tools
    # 영상도 LFS 라 같이 받는다. 빠뜨리면 포인터 텍스트가 자산으로 들어가
    # 배포본에서만 연출이 안 뜬다 — 빌드는 통과하므로 티가 안 난다.
    - git lfs pull --include="frontend/assets/models/*.onnx,frontend/android/app/src/main/assets/models/*.task,frontend/assets/videos/*.mp4"
    - |
      for model in \
        frontend/assets/models/depth_anything_v2_vits_int8.onnx \
        frontend/assets/models/modnet_photographic_portrait_matting_int8.onnx \
        frontend/android/app/src/main/assets/models/pose_landmarker_lite.task
      do
        ! head -n 1 "$model" | grep -qx 'version https://git-lfs.github.com/spec/v1'
      done
    - |
      : "${FIREBASE_SERVICE_ACCOUNT:?Set the Firebase service-account CI/CD variable}"
      # GitLab file variables already contain a path. For an ordinary masked
      # variable, materialize the JSON without printing it in the log.
      if [ -f "$FIREBASE_SERVICE_ACCOUNT" ]; then
        export GOOGLE_APPLICATION_CREDENTIALS="$FIREBASE_SERVICE_ACCOUNT"
      else
        umask 077
        printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CI_PROJECT_DIR/firebase-service-account.json"
        export GOOGLE_APPLICATION_CREDENTIALS="$CI_PROJECT_DIR/firebase-service-account.json"
      fi
    - cd frontend
    - flutter pub get

  script:
    # String.fromEnvironment is compiled into the APK. Without this define a
    # Firebase-installed app falls back to the emulator-only 10.0.2.2 address.
    - >
      flutter build apk --release
      --build-number="$CI_PIPELINE_IID"
      --dart-define=API_BASE_URL=https://api.ticketmoa.site
    - >
      firebase appdistribution:distribute
      build/app/outputs/flutter-apk/app-release.apk
      --app "$FIREBASE_APP_ID"
      --groups "$FIREBASE_TESTER_GROUP"
      --release-notes "${CI_COMMIT_SHORT_SHA} - ${CI_COMMIT_TITLE}"

  after_script:
    - rm -f "$CI_PROJECT_DIR/firebase-service-account.json"

  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes:
        - frontend/**/*
    - when: never
